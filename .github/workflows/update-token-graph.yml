name: Update profile cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test renderers
        run: |
          node --test scripts/render-token-graph.test.mjs
          node --test scripts/render-languages.test.mjs

      - name: Render token graph
        env:
          ALMANAC_ORIGIN: ${{ secrets.ALMANAC_ORIGIN }}
          ALMANAC_READ_TOKEN: ${{ secrets.ALMANAC_READ_TOKEN }}
        run: node scripts/render-token-graph.mjs

      # PROFILE_STATS_TOKEN is a PAT with `repo` scope. The default GITHUB_TOKEN
      # only sees this repository, so without a PAT the card would silently
      # report public repositories alone. Skipped rather than wrong, and never
      # allowed to fail the token graph above.
      # The secrets context is not usable inside `if:`, so the presence check
      # goes through env instead.
      - name: Render languages card
        if: env.GITHUB_TOKEN != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: node scripts/render-languages.mjs

      - name: Commit whatever changed
        run: |
          if git diff --quiet -- README.md assets/; then
            echo "Cards are already current."
            exit 0
          fi
          git config user.name "token-current[bot]"
          git config user.email "token-current[bot]@users.noreply.github.com"
          git add README.md assets/
          git commit -m "update profile cards"
          git push
