name: Update token graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: token-graph
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test renderer
        run: node --test scripts/render-token-graph.test.mjs

      - name: Render latest graph
        env:
          ALMANAC_ORIGIN: ${{ secrets.ALMANAC_ORIGIN }}
          ALMANAC_READ_TOKEN: ${{ secrets.ALMANAC_READ_TOKEN }}
        run: node scripts/render-token-graph.mjs

      - name: Commit graph when it changed
        run: |
          if git diff --quiet -- README.md assets/token-use.svg; then
            echo "Graph is already current."
            exit 0
          fi
          git config user.name "token-current[bot]"
          git config user.email "token-current[bot]@users.noreply.github.com"
          git add README.md assets/token-use.svg
          git commit -m "update 30-day token graph"
          git push
